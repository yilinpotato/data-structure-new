{% extends "base.html" %}

{% block title %}登录 - 学生选课管理系统{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card mt-5">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-mortarboard-fill" style="font-size: 3rem; color: #667eea;"></i>
                    <h3 class="mt-3">学生选课管理系统</h3>
                    <p class="text-muted">请登录您的账户</p>
                </div>
                
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">
                            <i class="bi bi-person"></i> 用户名
                        </label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">
                            <i class="bi bi-lock"></i> 密码
                        </label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right"></i> 登录
                    </button>
                </form>
                
                <div class="mt-3 text-center">
                    <small class="text-muted">
                        默认管理员账户: admin / admin
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
